[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "colombus"
version = "0.3.13"
description = "Colombus - The ML pipelines exploration platform"
authors = [
    { name = "Nicolas Lacroix", email = "nicolas.lacroix@univ-cotedazur.fr" }
]
readme = "README.md"
requires-python = ">=3.12.0,<4.0"
dependencies = [
    "canopus-dsl",
    "fastapi[standard]>=0.120.2",
    "google-api-python-client>=2.196.0",
    "google-auth>=2.53.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "jinja2>=3.1.6",
    "kaggle>=2.2.3",
    "matplotlib>=3.10.6",
    "numpy>=2.3.4",
    "plotly>=6.8.0",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.43",
    "sqlmodel>=0.0.24",
    "ujson>=5.12.0"
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4.7",
    "pre-commit>=3.7",
    "pytest>=9.1.1",
    "pytest-env>=1.8.2",
    "pyright>=1.1.414",
    "types-ujson>=5.10.0.20250822",
]

[tool.pyright]
include = ["app"]
venvPath = "."
venv = ".venv"

[tool.uv]
default-groups = []

[tool.uv.sources]
canopus-dsl = { git = "https://github.com/colombus-dev/canopus-dsl", tag = "v0.1.0"  }

[tool.vulture]
make_whitelist = true
min_confidence = 80
paths = ["app/"]
sort_by_size = true
verbose = false

[tool.pytest_env]
VESPUCCI_PARSER_API_URL_PREFIX=""
ENVIRONMENT="development"
ALLOWED_GOOGLE_EMAILS=""
GOOGLE_CLIENT_ID=""
JWT_SECRET="dev-secret-at-least-16-chars"
DB_NAME="colombus"
DB_USERNAME="colombus"
DB_PASSWORD="colombus"
DB_HOST="localhost"
DB_PORT=5433
ML_PROFILER_API_URL_PREFIX="http://mlprofiler_api:8081"
